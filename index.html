<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC7 Heading & Compass Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #2c2c2a;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 13px;
            color: #888;
        }

        .compass-container {
            text-align: center;
            margin-bottom: 2rem;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .compass-svg {
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card.accent {
            background: #e6f1fb;
            border-color: #85b7eb;
        }

        .card-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .card-value {
            font-size: 36px;
            font-weight: 500;
            color: #185fa5;
        }

        .card-value.large {
            font-size: 20px;
            color: #2c2c2a;
        }

        .card-subtext {
            font-size: 12px;
            color: #185fa5;
            margin-top: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .button-group.vertical {
            flex-direction: column;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: #378add;
            color: white;
            border: none;
        }

        button.primary:hover {
            background: #185fa5;
        }

        button.primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.secondary {
            background: transparent;
            color: #2c2c2a;
            border: 1px solid #e0e0e0;
        }

        button.secondary:hover {
            background: #f9f9f9;
        }

        button.secondary.active {
            background: #378add;
            color: white;
            border-color: #378add;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        input[type="text"],
        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #378add;
            box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.1);
        }

        .error {
            font-size: 12px;
            color: #e24b4a;
            margin-top: 0.5rem;
            display: none;
        }

        .feedback {
            background: #eaf3de;
            border: 1px solid #97c459;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
        }

        .feedback p {
            margin: 0;
            color: #3b6d11;
            font-size: 14px;
            font-weight: 500;
        }

        .feedback.error {
            background: #fcebeb;
            border-color: #f09595;
        }

        .feedback.error p {
            color: #a32d2d;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat {
            background: white;
            padding: 1rem;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
        }

        .button-group.small button {
            padding: 10px;
            font-size: 12px;
        }

        .tip {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1rem;
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }

        .tip strong {
            color: #2c2c2a;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #e0e0e0;
            }

            .container {
                background: #262626;
                border-color: #404040;
                box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            }

            .card {
                background: #303030;
                border-color: #404040;
                color: #e0e0e0;
            }

            .card.accent {
                background: #1a3a52;
                border-color: #2d5f8d;
            }

            .card-label {
                color: #aaa;
            }

            .card-value.large {
                color: #e0e0e0;
            }

            input[type="text"],
            input[type="number"] {
                background: #303030;
                border-color: #404040;
                color: #e0e0e0;
            }

            input[type="text"]:focus,
            input[type="number"]:focus {
                border-color: #378add;
                box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.2);
            }

            button.secondary {
                background: transparent;
                color: #e0e0e0;
                border-color: #404040;
            }

            button.secondary:hover {
                background: #303030;
            }

            .tip {
                background: #303030;
                color: #aaa;
            }

            .tip strong {
                color: #e0e0e0;
            }

            .stat {
                background: #303030;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kompassrose & Heading-Trainer</h1>
            <p>Übung für den PC7-Simulator</p>
        </div>

        <!-- Kompassrose -->
        <div class="compass-container">
            <svg class="compass-svg" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="140" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
                <circle cx="150" cy="150" r="135" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
                
                <line x1="150" y1="10" x2="150" y2="30" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                <line x1="150" y1="270" x2="150" y2="290" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                <line x1="10" y1="150" x2="30" y2="150" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                <line x1="270" y1="150" x2="290" y2="150" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                
                <line x1="250" y1="50" x2="240" y2="40" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                <line x1="250" y1="250" x2="240" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                <line x1="50" y1="250" x2="60" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                <line x1="50" y1="50" x2="60" y2="40" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                
                <text x="150" y="32" text-anchor="middle" font-size="16" font-weight="600" opacity="0.9">N</text>
                <text x="150" y="280" text-anchor="middle" font-size="16" font-weight="600" opacity="0.9">S</text>
                <text x="270" y="155" text-anchor="start" font-size="16" font-weight="600" opacity="0.9">E</text>
                <text x="20" y="155" text-anchor="end" font-size="16" font-weight="600" opacity="0.9">W</text>
                
                <text x="235" y="45" text-anchor="middle" font-size="12" opacity="0.7">NE</text>
                <text x="255" y="260" text-anchor="middle" font-size="12" opacity="0.7">SE</text>
                <text x="45" y="260" text-anchor="middle" font-size="12" opacity="0.7">SW</text>
                <text x="65" y="45" text-anchor="middle" font-size="12" opacity="0.7">NW</text>
                
                <text x="150" y="48" text-anchor="middle" font-size="10" opacity="0.5">360°</text>
                <text x="250" y="155" text-anchor="start" font-size="10" opacity="0.5">090°</text>
                <text x="150" y="268" text-anchor="middle" font-size="10" opacity="0.5">180°</text>
                <text x="60" y="155" text-anchor="end" font-size="10" opacity="0.5">270°</text>
            </svg>
        </div>

        <!-- Übungstyp -->
        <div style="margin-bottom: 1.5rem;">
            <label class="card-label">Übungstyp</label>
            <div class="button-group small">
                <button class="mode-btn secondary active" data-mode="numbers">Nur Zahlen</button>
                <button class="mode-btn secondary" data-mode="directions">Mit Richtungen</button>
                <button class="mode-btn secondary" data-mode="mixed">Gemischt</button>
            </div>
        </div>

        <!-- Aktueller Heading -->
        <div class="card accent">
            <div class="card-label">Aktueller Heading (HDG)</div>
            <div class="card-value" id="current-hdg">060°</div>
            <div class="card-subtext" id="current-dir">(ENE)</div>
        </div>

        <!-- Anweisung -->
        <div class="card">
            <div class="card-label">Anweisung</div>
            <div class="card-value large" id="instruction">TURN LEFT MINUS 180°</div>
        </div>

        <!-- Antwort Input -->
        <div class="input-group">
            <label>Neuer Heading</label>
            <div class="input-wrapper">
                <input type="text" id="answer-input" placeholder="z.B. 240 oder NW">
            </div>
            <div class="error" id="error-msg"></div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button id="check-btn" class="primary">Überprüfen</button>
            <button id="next-btn" class="secondary">Nächste</button>
        </div>

        <!-- Schwierigkeit -->
        <div style="margin-bottom: 1.5rem;">
            <label class="card-label">Schwierigkeit</label>
            <div class="button-group small">
                <button class="difficulty-btn secondary active" data-level="easy">Einfach</button>
                <button class="difficulty-btn secondary" data-level="medium">Mittel</button>
                <button class="difficulty-btn secondary" data-level="hard">Schwer</button>
            </div>
        </div>

        <!-- Feedback -->
        <div class="feedback" id="feedback">
            <p id="feedback-text"></p>
        </div>

        <!-- Statistik -->
        <div class="card" style="margin-bottom: 1.5rem;">
            <div class="card-label">Statistik</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">Korrekt</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="total">0</div>
                    <div class="stat-label">Gesamt</div>
                </div>
            </div>
        </div>

        <!-- Tipp -->
        <div class="tip">
            <strong>Tipp:</strong> LEFT (-) macht Heading kleiner | RIGHT (+) macht es größer. Heading ist immer 0-359°. Wenn negativ: +360 | Wenn ≥360: -360
        </div>
    </div>

    <script>
        const compassPoints = {
            'N': 0, 'NNE': 22, 'NE': 45, 'ENE': 68, 'E': 90, 'ESE': 112, 'SE': 135, 'SSE': 158,
            'S': 180, 'SSW': 202, 'SW': 225, 'WSW': 248, 'W': 270, 'WNW': 292, 'NW': 315, 'NNW': 338
        };

        function getCompassDirection(heading) {
            heading = Math.round(heading) % 360;
            let closest = 'N';
            let minDiff = 360;
            Object.entries(compassPoints).forEach(([dir, deg]) => {
                let diff = Math.abs(deg - heading);
                if (diff > 180) diff = 360 - diff;
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = dir;
                }
            });
            return closest;
        }

        function normalizeHeading(hdg) {
            hdg = Math.round(hdg);
            while (hdg < 0) hdg += 360;
            while (hdg >= 360) hdg -= 360;
            return hdg;
        }

        function parseInput(input) {
            input = input.trim().toUpperCase();
            if (!isNaN(input)) {
                const num = parseInt(input);
                if (num >= 0 && num <= 359) return num;
            }
            if (compassPoints[input] !== undefined) {
                return compassPoints[input];
            }
            return null;
        }

        let currentState = {
            currentHdg: 60,
            turnValue: 180,
            turnDirection: 'left',
            correctAnswer: 240,
            mode: 'numbers',
            difficulty: 'easy',
            streak: 0,
            total: 0
        };

        function generateQuestion() {
            let turnRange;
            if (currentState.difficulty === 'easy') {
                turnRange = [30, 90, 120, 180];
            } else if (currentState.difficulty === 'medium') {
                turnRange = [30, 60, 90, 120, 150, 180, 210, 270];
            } else {
                turnRange = [15, 30, 45, 60, 75, 90, 120, 150, 180, 210, 240, 270, 300, 330];
            }

            currentState.currentHdg = Math.floor(Math.random() * 360);
            currentState.turnDirection = Math.random() > 0.5 ? 'left' : 'right';
            currentState.turnValue = turnRange[Math.floor(Math.random() * turnRange.length)];

            let result = currentState.currentHdg;
            if (currentState.turnDirection === 'left') {
                result -= currentState.turnValue;
            } else {
                result += currentState.turnValue;
            }
            currentState.correctAnswer = normalizeHeading(result);

            const currentDir = getCompassDirection(currentState.currentHdg);
            document.getElementById('current-hdg').textContent = String(currentState.currentHdg).padStart(3, '0') + '°';
            document.getElementById('current-dir').textContent = '(' + currentDir + ')';

            const dir = currentState.turnDirection === 'left' ? 'LEFT' : 'RIGHT';
            const sign = currentState.turnDirection === 'left' ? 'MINUS' : 'PLUS';

            if (currentState.mode !== 'numbers' && Math.random() > 0.5) {
                const targetDir = getCompassDirection(currentState.correctAnswer);
                document.getElementById('instruction').textContent = `TURN ${dir} TO ${targetDir}`;
            } else {
                document.getElementById('instruction').textContent = `TURN ${dir} ${sign} ${currentState.turnValue}°`;
            }

            document.getElementById('answer-input').value = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input').value.trim();

            if (!input) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = 'Bitte gib eine Antwort ein.';
                errorMsg.style.display = 'block';
                return;
            }

            const answer = parseInput(input);
            if (answer === null) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = 'Ungültig. Z.B.: 240, NW, oder SE';
                errorMsg.style.display = 'block';
                return;
            }

            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedback-text');

            if (answer === currentState.correctAnswer) {
                currentState.streak++;
                currentState.total++;
                const correctDir = getCompassDirection(currentState.correctAnswer);
                feedbackText.textContent = `✓ Richtig! ${currentState.correctAnswer}° (${correctDir})`;
                feedback.classList.remove('error');
            } else {
                currentState.streak = 0;
                currentState.total++;
                const correctDir = getCompassDirection(currentState.correctAnswer);
                feedbackText.textContent = `✗ Falsch. Richtig: ${currentState.correctAnswer}° (${correctDir})`;
                feedback.classList.add('error');
            }

            feedback.style.display = 'block';
            document.getElementById('streak').textContent = currentState.streak;
            document.getElementById('total').textContent = currentState.total;
            document.getElementById('answer-input').disabled = true;
            document.getElementById('check-btn').disabled = true;
        }

        document.getElementById('check-btn').addEventListener('click', checkAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('answer-input').disabled) {
                checkAnswer();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            document.getElementById('answer-input').disabled = false;
            document.getElementById('check-btn').disabled = false;
            generateQuestion();
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentState.mode = e.target.dataset.mode;
                generateQuestion();
            });
        });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentState.difficulty = e.target.dataset.level;
                currentState.streak = 0;
                currentState.total = 0;
                document.getElementById('streak').textContent = '0';
                document.getElementById('total').textContent = '0';
                generateQuestion();
            });
        });

        generateQuestion();
    </script>
</body>
</html>
